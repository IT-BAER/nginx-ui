name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Frontend Audit
        run: |
          cd app
          pnpm install
          pnpm audit --audit-level=high || true
      
      - name: Go Security Checker (gosec)
        uses: securego/gosec@master
        with:
          args: -exclude=G104,G304,G204,G114,G115 -tests=false ./...
      
      - name: Display Go Code Quality (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          only-new-issues: true

  build-and-release:
    needs: security-and-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Build Frontend
        run: |
          cd app
          pnpm install
          pnpm build
          
      - name: Build Backend
        run: |
          GOOS=linux GOARCH=amd64 go build -o nginx-ui -trimpath -ldflags "-s -w -buildid=" main.go
          tar -czvf nginx-ui-linux-amd64.tar.gz nginx-ui
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: nginx-ui-linux-amd64.tar.gz
          generate_release_notes: true
