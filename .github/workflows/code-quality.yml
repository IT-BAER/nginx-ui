name: Code Quality

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "app/**/*.ts"
      - "app/**/*.vue"
      - "app/**/*.js"
      - ".github/workflows/code-quality.yml"
      - ".golangci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "app/**/*.ts"
      - "app/**/*.vue"
      - "app/**/*.js"
      - ".github/workflows/code-quality.yml"
      - ".golangci.yml"

permissions:
  contents: read
  security-events: write

jobs:
  go-lint:
    name: Go Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=8m
          only-new-issues: true

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
